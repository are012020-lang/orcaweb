<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orcaweb – Motion de lançamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap">
<style>
:root{--cy:#2de2e6;--tl:#1fb7a6;--ink:#fff;--bg:#000;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:Montserrat,Arial,sans-serif;color:var(--ink)}
#st{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#000;overflow:hidden;transform-origin:center;cursor:pointer}
#glow{position:absolute;inset:0;background:radial-gradient(900px 600px at 70% 50%,#0a3a40 0,#000 70%);opacity:.55}
.sc{position:absolute;inset:0;opacity:0}
.hl{position:absolute;left:120px;top:0;bottom:0;width:860px;display:flex;flex-wrap:wrap;align-content:center;gap:0 .26em;font-weight:800;font-size:124px;line-height:1.06;letter-spacing:-.02em}
.hl.c2{left:0;right:0;width:auto;justify-content:center;text-align:center}
.w{display:inline-block;overflow:hidden;padding-bottom:.1em}
.w i{display:block;font-style:normal}
.w i.c{color:var(--cy)}
.fr{position:absolute;border-radius:20px;background:#0b1316;border:1px solid #1d4046;box-shadow:0 0 90px #19d6d62e,0 40px 100px #000;overflow:hidden}
.fr img{display:block;width:100%}
.bar{height:44px;display:flex;align-items:center;gap:9px;padding:0 18px;background:#102126}
.bar b{width:12px;height:12px;border-radius:50%;background:#2b5159}
.chip{position:absolute;padding:14px 26px;border-radius:40px;background:#0d2a2f;border:1px solid #2de2e655;font-weight:500;font-size:28px;color:var(--cy);box-shadow:0 0 40px #2de2e622}
#logo,#logo2{position:absolute;mix-blend-mode:screen}
.d{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--cy);box-shadow:0 0 16px var(--cy)}
.pn{position:absolute;border-radius:24px;background:#09171a;border:1px solid #1d4046;box-shadow:0 0 90px #19d6d62e,0 40px 100px #000}
#bars{position:absolute;left:60px;right:60px;bottom:60px;height:380px;display:flex;align-items:flex-end;gap:30px}
#bars div{flex:1;border-radius:12px 12px 0 0;background:linear-gradient(#2de2e6,#0e6f78);transform-origin:bottom}
.nt{position:absolute;left:40px;right:40px;height:78px;border-radius:16px;background:#0f262b;border:1px solid #1d4046;display:flex;align-items:center;gap:20px;padding:0 26px;font-size:28px;font-weight:500}
.nt:before{content:"";width:16px;height:16px;border-radius:50%;background:var(--cy);box-shadow:0 0 14px var(--cy)}
#pb{position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--cy);transform-origin:left;transform:scaleX(0)}
.tx{position:absolute;left:0;right:0;text-align:center;font-weight:500}
@media (prefers-reduced-motion:reduce){#glow{opacity:.3}}
</style>
</head>

const st=document.getElementById('st'),$=s=>document.querySelector(s);
document.querySelectorAll('[data-k]').forEach(e=>e.src=IMG[e.dataset.k]);
document.querySelectorAll('.hl').forEach(h=>{const a=+h.dataset.a;h.innerHTML=h.dataset.t.split(' ').map((w,i)=>`<span class="w"><i class="${i>=a?'c':''}">${w}</i></span>`).join('')});
document.getElementById('bars').innerHTML=[22,30,38,48,60,76,96].map(p=>`<div style="height:${p*.78}%"></div>`).join('');
const fit=()=>st.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`;
fit();addEventListener('resize',fit);

const tl=gsap.timeline({paused:true,onUpdate(){$('#pb').style.transform=`scaleX(${tl.progress()})`}});
function echo(el){for(let i=1;i<=3;i++){const c=el.cloneNode(true);c.removeAttribute('id');c.style.pointerEvents='none';st.insertBefore(c,el);gsap.set(c,{opacity:.34/i});gsap.to(c,{x:'-='+(220*i),opacity:0,duration:.75,ease:'power2.in',onComplete:()=>c.remove()})}}
function scene(id,a,b){const el=$(id);
 tl.fromTo(el,{opacity:0,x:170},{opacity:1,x:0,duration:.5,ease:'power3.out'},a);
 tl.call(()=>echo(el),null,b-.05);
 tl.to(el,{x:-280,opacity:0,duration:.45,ease:'power3.in'},b-.05);
 tl.from(id+' .w i',{yPercent:115,duration:.75,stagger:.13,ease:'power4.out'},a+.25)}

/* 1 · abertura */
tl.fromTo('#s0',{opacity:0},{opacity:1,duration:.1},0);
tl.from('#logo',{scale:.78,opacity:0,duration:1.6,ease:'power3.out'},.2);
tl.fromTo('#logo',{filter:'drop-shadow(0 0 10px #2de2e6)'},{filter:'drop-shadow(0 0 50px #2de2e6)',duration:1.2,yoyo:true,repeat:1,ease:'sine.inOut'},1);
tl.call(()=>echo($('#s0')),null,3.75);
tl.to('#s0',{x:-280,opacity:0,duration:.45,ease:'power3.in'},3.75);

/* 2 · presença digital */
scene('#s1',4,8.6);
tl.from('#f1',{y:90,opacity:0,scale:.92,duration:.9,ease:'power3.out'},4.6);
tl.from('#c1',{scale:.6,opacity:0,duration:.5,ease:'back.out(2)'},5.5);
tl.fromTo('#f1 img',{scale:1},{scale:1.08,duration:3.4,ease:'none'},5);

/* 3 · modernos e responsivos */
scene('#s2',8.4,13.4);
tl.from('#f2',{y:90,opacity:0,duration:.8,ease:'power3.out'},9);
tl.from('#f3',{y:160,opacity:0,duration:.9,ease:'power3.out'},9.5);
tl.from(['#c2','#c3'],{scale:.6,opacity:0,duration:.45,stagger:.3,ease:'back.out(2)'},10.4);
tl.to('#f3',{y:-26,duration:1.6,yoyo:true,repeat:1,ease:'sine.inOut'},10.6);

/* 4 · crescimento */
scene('#s3',13.2,18.4);
tl.from('#s3 .pn',{scale:.9,opacity:0,duration:.7,ease:'power3.out'},13.7);
tl.from('#bars div',{scaleY:0,duration:.8,stagger:.14,ease:'power3.out'},14.2);
tl.from('#arr',{strokeDashoffset:1,duration:1.8,ease:'power2.inOut'},14.8);
tl.from('#ah',{opacity:0,scale:.2,transformOrigin:'center',duration:.4},16.5);

/* 5 · vendas */
scene('#s4',18.2,23.4);
tl.from('#s4 .pn',{scale:.9,opacity:0,duration:.7,ease:'power3.out'},18.7);
const o={v:0};
tl.to(o,{v:248,duration:2.2,ease:'power2.out',onUpdate(){$('#cnt').textContent='+'+Math.round(o.v)+'%'}},19.2);
tl.from('#ln',{strokeDashoffset:1,duration:2,ease:'power2.inOut'},19.2);
tl.from('#s4 .nt',{x:90,opacity:0,duration:.55,stagger:.45,ease:'power3.out'},20.2);

/* 6 · parceiro digital */
scene('#s5',23.2,27);
tl.from('#f5',{scale:.85,rotate:-3,opacity:0,duration:1,ease:'power3.out'},23.8);
tl.to('#f5',{y:-20,duration:1.8,yoyo:true,repeat:1,ease:'sine.inOut'},24.8);

/* 7 · elementos formam o logo */
for(let i=0;i<44;i++){const d=document.createElement('div');d.className='d';st.appendChild(d);
 const e=Math.random()*6.28,r=60+Math.random()*190,side=Math.random()<.5?-80:2000;
 gsap.set(d,{opacity:0,x:side,y:Math.random()*1080});
 tl.to(d,{opacity:1,duration:.2},26.7+i*.01);
 tl.to(d,{x:960+Math.cos(e)*r,y:360+Math.sin(e)*r*.8,duration:.9,ease:'power3.inOut'},26.8+i*.012);
 tl.to(d,{x:960,y:360,scale:.2,opacity:0,duration:.45,ease:'power2.in'},27.9)}
tl.set('#s6',{opacity:1},26.8);
tl.fromTo('#logo2',{scale:.6,opacity:0},{scale:1,opacity:1,duration:1,ease:'power3.out'},27.7);
tl.from('#tg',{y:40,opacity:0,duration:.8,ease:'power3.out'},28.5);
tl.from('#ct',{y:30,opacity:0,duration:.7,ease:'power3.out'},29.1);

let go=()=>tl.restart();
st.addEventListener('click',()=>tl.paused()?tl.play():tl.progress()>=1?tl.restart():tl.pause());
tl.play();
</script>
